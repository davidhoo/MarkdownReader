help_features_title: "Feature Details"
help_features_subtitle: "Every feature crafted for a better reading experience"
feat_render_title: "Rendered View"
feat_render_desc: "cmark-gfm parses Markdown, WebPage (native macOS 26) renders rich text with full GFM extensions including tables, task lists, strikethrough, and autolinks."
feat_switch_title: "Seamless Mode Switching"
feat_switch_desc: "Powered by fractional source anchor pipeline (SourceScrollAnchor), keeping your reading position pinpointed between rendered and source modes without jumping."
feat_edit_title: "Source Editing & Line Numbers"
feat_edit_desc: "Press ⇧⌘R to edit Markdown source directly, with Prism.js highlighting 30+ languages. Optional gutter line numbers in Appearance settings with smooth scrolling."
feat_multiwindow_title: "Native Multi-Window"
feat_multiwindow_desc: "Press ⇧⌘N to open independent windows. Browse multiple files side-by-side with isolated editing sessions and per-window undo stacks."
feat_filetree_title: "Smart File Tree"
feat_filetree_desc: "Recursively browse folders with symlink support and live change monitoring. Option to auto-open containing directory when opening a single file."
feat_outline_title: "Outline Navigation"
feat_outline_desc: "Auto-extract heading hierarchy, smooth scroll unified to top of viewport for effortless long document reading."
feat_find_title: "Find & Replace"
feat_find_desc: "Press ⌘F for the search bar. Supports case sensitivity, whole words, and regular expressions. ⌥⌘F opens Find & Replace."
feat_zoom_title: "View Zoom"
feat_zoom_desc: "Use ⌘+ / ⌘- to zoom (0.3x–3.0x). Press ⌘0 to restore actual size; zoom levels restore automatically."
feat_command_palette_title: "Command Palette"
feat_command_palette_desc: "Press ⌘P to quickly search and open Markdown files in the directory tree with fuzzy matching and keyboard navigation."

help_themes_title: "Themes & Appearance"
help_themes_subtitle: "33 themes to customize your reading environment"
feat_mode_title: "Theme Mode"
feat_mode_desc: "In Settings → Appearance, choose Light, Dark, or System mode to adapt the application immediately."
feat_palette_title: "Color Schemes"
feat_palette_desc: "33 preset schemes (20 dark + 13 light) — Dracula, Catppuccin, Nord, Tokyo Night… with independent presets per mode."
feat_custom_title: "Custom Colors"
feat_custom_desc: "In Settings → Appearance → Custom Colors, adjust background, text, accent, success, and danger colors individually."
feat_contrast_title: "Contrast Control"
feat_contrast_desc: "Low and High contrast options to fine-tune visual separation between background and foreground elements."

help_diagrams_title: "Diagrams & Formulas"
help_diagrams_subtitle: "Flawless rendering for technical documentation"
feat_mermaid_help_title: "Dual Diagram Engines (Mermaid / Pele)"
feat_mermaid_help_desc: "Use `mermaid` language identifier in code blocks. Switch engines in General settings: default Mermaid.js for classic layouts, or Pele for native SVGs that dynamically color-match themes."
feat_katex_title: "Math Formulas (KaTeX)"
feat_katex_desc: "Use `$...$` for inline formulas and `$$...$$` for block formulas. Crisp LaTeX typography loaded on demand only when formulas are present."
feat_plantuml_help_title: "PlantUML Diagrams"
feat_plantuml_help_desc: "Use `plantuml` language identifier to auto-render SVG diagrams. Requires network connection."

help_cli_title: "CLI Tool mdr"
help_cli_subtitle: "Seamless terminal workflow"
feat_cli_install_title: "Installation"
feat_cli_install_desc: "Open Settings → General → Command Line Tool and toggle it on. The `mdr` command is immediately available in your shell."
feat_cli_use_title: "Usage"
feat_cli_use_desc: "Run `mdr README.md` in the terminal to open files, supporting multiple files and directories at once."

help_more_title: "More Features"
help_more_subtitle: "More thoughtful details waiting for you"
feat_ql_title: "Quick Look Preview"
feat_ql_desc: "Select a .md file in Finder and press Space to preview rendered content. Enable in Settings → General → Quick Look Preview."
feat_export_title: "Export PDF"
feat_export_desc: "Press ⌥⌘E or File → Export PDF to save rendered content as PDF, preserving current theme styles."
feat_document_copy_title: "Copy Document Content"
feat_document_copy_desc: "Copy the entire document in one click from rendered mode, source mode, or Quick Look. Turn off in Settings; Quick Look supports rich text or raw Markdown."

help_faq_title: "FAQ"
help_faq_subtitle: "Having issues? Check here first"
faq_formats_q: "What file formats are supported?"
faq_formats_a: "Supports `.md`, `.markdown`, `.mdown`, `.mkd` and other Markdown format files."
faq_system_q: "What are the system requirements?"
faq_system_a: "macOS 26 (Tahoe) or later, natively supporting Apple Silicon."
faq_homebrew_q: "How to install and upgrade via Homebrew?"
faq_homebrew_a: "Run `brew tap davidhoo/markdownreader && brew install --cask markdownreader`. When upgrading, run `brew upgrade --cask --greedy markdownreader`."
faq_gatekeeper_q: "What to do if macOS blocks first launch?"
faq_gatekeeper_a: "MarkdownReader is developer-signed open source software without Apple Developer paid notarization. If Gatekeeper blocks opening, Control-click the app in Applications and select 'Open', or go to 'System Settings > Privacy & Security' and click 'Open Anyway'."
faq_plantuml_q: "PlantUML diagrams not rendering?"
faq_plantuml_a: "PlantUML rendering requires a network connection to the server. Offline, Mermaid and Pele diagrams render completely locally."
faq_default_q: "How to set Markdown Reader as the default app?"
faq_default_a: "Open Settings → General → Default Markdown App and click 'Set as Default'. Or right-click a .md file → Get Info → Open With → select Markdown Reader → click 'Change All'."
faq_feedback_q: "How to report issues or suggestions?"
faq_feedback_a: "Feel free to submit feedback or pull requests on GitHub Issues."

