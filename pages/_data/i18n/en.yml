# Features
features_title: "Why This One?"
features_subtitle: "There are more Markdown tools than ever, but you just want to quietly read a document"
feature_instant_title: "Instant Launch"
feature_instant_desc: "Native macOS app. Fast startup, fast switching, smooth reading. No splash screen, no loading wait."
feature_focus_title: "Focused Reading"
feature_focus_desc: "Three-pane layout — file tree + rendered view + outline navigation. See document structure at a glance."
feature_multiwindow_title: "Native Multi-Window"
feature_multiwindow_desc: "Open multiple independent window sessions (⇧⌘N) with isolated edit states and per-window undo stacks."
feature_seamless_switch_title: "Seamless Mode Switching"
feature_seamless_switch_desc: "Fractional source anchor pipeline preserves reading position accurately without jumping or screen flash."
feature_mermaid_title: "Dual Diagram Engines"
feature_mermaid_desc: "Choose classic Mermaid.js or native lightweight Pele engine; ```mermaid SVG colors blend into themes; PlantUML supported."
feature_math_title: "Math Formulas"
feature_math_desc: "KaTeX renders LaTeX inline and block formulas, loaded on demand for delicate technical documentation typography."
feature_linenumbers_title: "Live Editing & Line Numbers"
feature_linenumbers_desc: "Direct editing in source mode, ⌘S to save; optional gutter source line numbers with adaptive width and jitter-free scrolling."
feature_smart_tree_title: "Smart File Tree"
feature_smart_tree_desc: "Recursive folder browsing, symlink support, and live file monitoring; optional auto-open containing folder for single files."
feature_outline_title: "Outline Navigation"
feature_outline_desc: "Auto-extract heading hierarchy, smooth scroll unified to top of viewport for efficient long document reading."
feature_quicklook_title: "Quick Look Preview"
feature_quicklook_desc: "Select a .md file in Finder and press Space to preview rendered content — no app launch needed."
feature_document_copy_title: "Copy Document Content"
feature_document_copy_desc: "Copy an entire document from rendered mode, source mode, or Quick Look in one click; toggle off in Settings; rich text or raw Markdown."
feature_themes_title: "33 Themes"
feature_themes_desc: "20 dark + 13 light — Dracula, Catppuccin, Nord, Tokyo Night… Including Markdown Preview Enhanced style themes."
feature_command_palette_title: "Command Palette"
feature_command_palette_desc: "Press ⌘P to quickly search and open files with fuzzy matching, arrow keys navigation, and Enter to open."
feature_cli_title: "CLI Tool mdr"
feature_cli_desc: "Type `mdr README.md` in the terminal to open files or directories. Seamless developer workflow."
feature_lightweight_title: "Tiny & Lightweight"
feature_lightweight_desc: "DMG installer under 10MB. Diagrams and math scripts load on demand; plain Markdown uses zero extra memory."
feature_drag_title: "Drag & Drop"
feature_drag_desc: "Drag .md files or folders directly into the window to start reading instantly."
feature_pdf_title: "Export PDF"
feature_pdf_desc: "One-click export rendered Markdown to PDF, preserving theme styles for easy sharing and archiving."

