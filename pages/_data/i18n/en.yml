help_quickstart_title: "Quick Start"
help_quickstart_subtitle: "Open a file and start reading — it is that simple"
help_qs_open_title: "1. Open Files or Folders"
help_qs_open_desc: "Press ⌘O to select files, or press ⇧⌘N to create a new independent window. Drag-and-drop is also supported."
help_qs_read_title: "2. Read & Seamless Switch"
help_qs_read_desc: "File tree on the left, content in the center, outline on the right. Press ⇧⌘E / ⇧⌘R to switch between rendered and source without losing scroll position."
help_qs_edit_title: "3. Edit & Line Numbers"
help_qs_edit_desc: "Edit directly in source mode, press ⌘S to save. Enable source line numbers in Settings for long-form editing."
help_qs_command_palette_title: "4. Quick File Open"
help_qs_command_palette_desc: "Press ⌘P to open the Command Palette, fuzzy search by filename, ↑↓ to select, Enter to open. Faster than browsing."

