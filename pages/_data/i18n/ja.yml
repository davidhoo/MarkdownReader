# Features
features_title: "なぜこのアプリ？"
features_subtitle: "Markdownツールは増え続けていますが、あなたはただ静かに文書を読みたいだけ"
feature_instant_title: "瞬間起動"
feature_instant_desc: "ネイティブ macOS アプリ。高速起動、高速切り替え、スムーズな読書。スプラッシュスクリーンもロード待ちもありません。"
feature_focus_title: "読書に集中"
feature_focus_desc: "3ペインレイアウト — ファイルツリー + レンダリングビュー + アウトラインナビゲーション。文書構造を一目で把握。"
feature_multiwindow_title: "ネイティブマルチウィンドウ"
feature_multiwindow_desc: "独立したウィンドウセッション（⇧⌘N）をサポート。ウィンドウごとの編集状態と独立した Undo スタックで、並行閲覧が快適。"
feature_seamless_switch_title: "スムーズなモード切替"
feature_seamless_switch_desc: "小数点ソースアンカー技術により、閲覧位置を正確に保持しながらレンダリングとソース編集をシームレスに切り替え。"
feature_mermaid_title: "デュアル図表エンジン選択"
feature_mermaid_desc: "定番の Mermaid.js と軽量 Pele エンジンから選択可能。同一の ```mermaid 構文で、SVG 配色がアプリテーマと深く調和。"
feature_math_title: "数式"
feature_math_desc: "KaTeX で LaTeX インライン・ブロック数式をレンダリング。必要な時だけ読み込むオンデマンド構成で軽快。"
feature_linenumbers_title: "ライブ編集と行番号"
feature_linenumbers_desc: "ソースモードで直接編集、⌘S で保存。エディタ行番号（Gutter）の表示切替対応（幅自動調整、ブレのないスクロール）。"
feature_smart_tree_title: "スマートファイルツリー"
feature_smart_tree_desc: "フォルダの再帰閲覧、ディレクトリシンボリックリンク対応、リアルタイム変更検知。単一ファイルオープン時に同一フォルダ自動展開対応。"
feature_outline_title: "アウトラインナビゲーション"
feature_outline_desc: "見出し階層を自動抽出、スムーズスクロールでビューポート上部に統一配置、長文書の閲覧を効率化。"
feature_quicklook_title: "Quick Look プレビュー"
feature_quicklook_desc: "Finder で .md ファイルを選択してスペースキーを押すとプレビュー。アプリ起動不要。"
feature_document_copy_title: "文書をワンクリックでコピー"
feature_document_copy_desc: "レンダリング、ソース、Quick Look からワンクリックで全文コピー。設定で一括無効化可能、リッチテキストまたは Markdown 原文を選択。"
feature_themes_title: "33 テーマ"
feature_themes_desc: "20 ダーク + 13 ライト — Dracula、Catppuccin、Nord、Tokyo Night… Markdown Preview Enhanced スタイルテーマ含む。"
feature_command_palette_title: "コマンドパレット"
feature_command_palette_desc: "⌘P でファジーマッチによるファイル検索とキーボードナビゲーションで素早くファイルを開けます。"
feature_cli_title: "CLI ツール mdr"
feature_cli_desc: "ターミナルで `mdr README.md` と入力するだけでファイルやディレクトリを開けます。開発者ワークフローにシームレス。"
feature_lightweight_title: "超軽量 & オンデマンド"
feature_lightweight_desc: "DMG インストーラは10MB未満。図表や数式は必要時にのみロードされ、通常の Markdown 読書はメモリ消費ゼロ。"
feature_drag_title: "ドラッグ＆ドロップ"
feature_drag_desc: ".md ファイルやフォルダをウィンドウに直接ドラッグして、すぐに読み始められます。"
feature_pdf_title: "PDF 書き出し"
feature_pdf_desc: "レンダリング済み Markdown をワンクリックで PDF に書き出し。テーマスタイルを保持し、共有とアーカイブに便利。"

