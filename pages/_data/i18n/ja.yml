help_quickstart_title: "クイックスタート"
help_quickstart_subtitle: "ファイルを開いて読み始める — それだけです"
help_qs_open_title: "1. ファイルまたはフォルダを開く"
help_qs_open_desc: "⌘O でファイルを選択するか、⇧⌘N で新しい独立ウィンドウを開きます。ドラッグ＆ドロップにも対応。"
help_qs_read_title: "2. 読書とスムーズな切替"
help_qs_read_desc: "左側にファイルツリー、中央にコンテンツ、右側にアウトライン。⇧⌘E / ⇧⌘R で閲覧位置を失わずにレンダリングとソースを相互切替。"
help_qs_edit_title: "3. 編集と行番号"
help_qs_edit_desc: "ソースモードで直接編集し、⌘S で保存。設定で行番号を有効にすると長文編集も快適。"
help_qs_command_palette_title: "4. ファイルを素早く開く"
help_qs_command_palette_desc: "⌘P でコマンドパレットを開き、ファイル名を入力して検索、↑↓ で選択、Enter で開きます。"

