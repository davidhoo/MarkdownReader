help_features_title: "機能詳細"
help_features_subtitle: "すべては読書体験の向上のために"
feat_render_title: "レンダリングビュー"
feat_render_desc: "cmark-gfm で Markdown を解析し、WebPage（macOS 26 ネイティブ）でレンダリング。テーブル、タスクリスト、取り消し線、自動リンクなどの完全な GFM 拡張に対応。"
feat_switch_title: "スムーズなモード切替"
feat_switch_desc: "小数点ソースアンカーパイプライン（SourceScrollAnchor）により、レンダリングモードとソースモードの切り替え時にも閲覧位置を正確に維持。ジャンプや白画面がありません。"
feat_edit_title: "ソース編集と行番号"
feat_edit_desc: "⇧⌘R で Markdown ソースを直接編集。Prism.js による 30+ 言語ハイライト。外観設定でエディタ行番号（Gutter）を表示可能（幅自動調整・安定スクロール）。"
feat_multiwindow_title: "ネイティブマルチウィンドウ"
feat_multiwindow_desc: "⇧⌘N で独立ウィンドウを新規作成。複数の文書やディレクトリを並行して開け、独立した編集状態と Undo スタックを保持します。"
feat_filetree_title: "スマートファイルツリー"
feat_filetree_desc: "フォルダの再帰閲覧、ディレクトリシンボリックリンクの完全サポート、外部変更のリアルタイム検知。「単一ファイルオープン時に同一フォルダを自動展開」にも対応。"
feat_outline_title: "アウトラインナビゲーション"
feat_outline_desc: "見出し階層を自動抽出し、クリックするとスムーズスクロールで上部約12ptに統一配置。長文の閲覧に便利。"
feat_find_title: "検索と置換"
feat_find_desc: "⌘F で検索バーを開きます。大文字小文字の区別、完全一致、正規表現に対応。⌥⌘F で検索と置換を開きます。"
feat_zoom_title: "ビューの拡大・縮小"
feat_zoom_desc: "⌘+ / ⌘- でズーム（0.3x〜3.0x）。⌘0 で原寸大に戻せます。ズーム倍率は自動記憶。"
feat_command_palette_title: "コマンドパレット"
feat_command_palette_desc: "⌘P でコマンドパレットを開き、ファジーマッチでファイルツリー内のファイルを検索・キーボードで素早く開けます。"

help_themes_title: "テーマと外観"
help_themes_subtitle: "33 テーマで読書空間をカスタマイズ"
feat_mode_title: "テーマモード"
feat_mode_desc: "設定 → 外観 で、ライト・ダーク・システム追従の3モードから選択可能。即座に外観が切り替わります。"
feat_palette_title: "カラーパレット"
feat_palette_desc: "33 のプリセット配色（20 ダーク + 13 ライト）— Dracula、Catppuccin、Nord、Tokyo Night… 各モード独立設定。"
feat_custom_title: "カスタムカラー"
feat_custom_desc: "設定 → 外観 → カスタムカラー で、背景色、文字色、アクセント色、成功色、危険色を個別に微調整可能。"
feat_contrast_title: "コントラスト調整"
feat_contrast_desc: "低/高の2段階コントラスト設定で、背景と前景レイヤーの視覚的メリハリを調整できます。"

help_diagrams_title: "図表と数式"
help_diagrams_subtitle: "技術文書の完璧な描画"
feat_mermaid_help_title: "デュアル図表エンジン (Mermaid / Pele)"
feat_mermaid_help_desc: "コードブロックで `mermaid` 識別子を使用。一般設定でエンジンを切り替え可能：定番の Mermaid.js レイアウト、またはアプリテーマと連動する軽量 Pele SVG エンジン。完全ローカル描画。"
feat_katex_title: "数式 (KaTeX)"
feat_katex_desc: "インライン数式は `$...$`、ブロック数式は `$$...$$` で囲みます。数式を含む文書でのみオンデマンドでライブラリをロード。"
feat_plantuml_help_title: "PlantUML 図表"
feat_plantuml_help_desc: "コードブロックで `plantuml` を指定すると SVG として自動描画（ネットワーク接続が必要）。"

help_cli_title: "CLI ツール mdr"
help_cli_subtitle: "ターミナルワークフローに統合"
feat_cli_install_title: "インストール"
feat_cli_install_desc: "設定 → 一般 → コマンドラインツール のスイッチをオンにするだけでインストール完了。ターミナルですぐに `mdr` が使えます。"
feat_cli_use_title: "使い方"
feat_cli_use_desc: "ターミナルで `mdr README.md` と入力するだけ。複数のファイルやフォルダの同時オープンにも対応。"

help_more_title: "その他の機能"
help_more_subtitle: "読書を支える細やかな工夫"
feat_ql_title: "Quick Look プレビュー"
feat_ql_desc: "Finder で .md ファイルを選択しスペースキーでプレビュー。設定 → 一般 → Quick Look プレビュー で有効化。"
feat_export_title: "PDF 書き出し"
feat_export_desc: "⌥⌘E または ファイル → PDF 書き出し で、現在のテーマスタイルを保持したまま PDF 保存。"
feat_document_copy_title: "文書をワンクリックでコピー"
feat_document_copy_desc: "レンダリング、ソース、Quick Look のいずれからも全文をワンクリックコピー。設定で一括オフ可能。リッチテキストまたは Markdown 原文を選択。"

help_faq_title: "よくある質問"
help_faq_subtitle: "お困りですか？まずこちらをチェック"
faq_formats_q: "対応しているファイル形式は？"
faq_formats_a: "`.md`、`.markdown`、`.mdown`、`.mkd` などの Markdown 形式ファイルに対応しています。"
faq_system_q: "動作環境は？"
faq_system_a: "macOS 26 (Tahoe) 以降。Apple Silicon にネイティブ対応しています。"
faq_homebrew_q: "Homebrew でのインストールとアップグレード方法は？"
faq_homebrew_a: "`brew tap davidhoo/markdownreader && brew install --cask markdownreader` でインストールできます。アップグレード時は `brew upgrade --cask --greedy markdownreader` を実行してください。"
faq_gatekeeper_q: "初回起動時に開けない、または未署名の警告が出る場合は？"
faq_gatekeeper_a: "MarkdownReader は開発者署名済みのオープンソースアプリですが、Apple Developer の有償公証は受けていません。Gatekeeper でブロックされた場合は、Finder のアプリケーションフォルダでアプリを Control キーを押しながらクリックして「開く」を選択するか、「システム設定 > プライバシーとセキュリティ」から「このまま開く」をクリックしてください。"
faq_plantuml_q: "PlantUML 図表が表示されない？"
faq_plantuml_a: "PlantUML 描画にはサーバーへのネットワーク接続が必要です。オフライン環境でも Mermaid / Pele 図表は完全ローカルで描画されます。"
faq_default_q: "Markdown Reader をデフォルトアプリに設定するには？"
faq_default_a: "設定 → 一般 → デフォルト Markdown アプリ で「デフォルトに設定」をクリック。または .md ファイルの情報ウィンドウ（⌘I）から変更できます。"
faq_feedback_q: "フィードバックや不具合報告はどこへ？"
faq_feedback_a: "GitHub Issues でのフィードバックや Pull Request を歓迎しています。"

