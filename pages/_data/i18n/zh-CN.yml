# Features
features_title: "为什么选它？"
features_subtitle: "市面上 Markdown 工具越来越多，但你只是想安静地读完一个文档"
feature_instant_title: "秒开秒读"
feature_instant_desc: "原生 macOS 应用，启动快、切换快、阅读流畅。没有启动画面，没有加载等待。"
feature_focus_title: "专注阅读"
feature_focus_desc: "三栏布局——目录树 + 渲染视图 + 大纲导航，一眼看清文档结构，长文档也不迷路。"
feature_multiwindow_title: "原生多窗口"
feature_multiwindow_desc: "支持多窗口独立会话（⇧⌘N），每个窗口拥有独立编辑与撤销栈，多篇文档并排查阅不冲突。"
feature_seamless_switch_title: "平滑模式切换"
feature_seamless_switch_desc: "基于小数源码锚点管线，在渲染视图与原文编辑间无缝切换，精确定位不跳行、不白屏。"
feature_mermaid_title: "双图表引擎可选"
feature_mermaid_desc: "支持经典 Mermaid.js 与原生轻量 Pele 引擎，同一段 ```mermaid SVG 配色深度融入主题；支持 PlantUML。"
feature_math_title: "数学公式"
feature_math_desc: "KaTeX 渲染 LaTeX 行内和块级公式，按需轻量加载，技术文档排版细腻。"
feature_linenumbers_title: "实时编辑与源码行号"
feature_linenumbers_desc: "原文模式直接编辑，⌘S 保存；可选显示源码行号（Gutter），自适应宽度，滚动流畅不抖动。"
feature_smart_tree_title: "智能目录树"
feature_smart_tree_desc: "递归浏览文件夹，支持目录软链接与文件变动实时监听；可选打开单文档时自动列出所在目录。"
feature_outline_title: "大纲导航"
feature_outline_desc: "自动提取标题层级，点击平滑滚动并统一定位至视口顶部，阅读长文档更高效。"
feature_quicklook_title: "Quick Look 预览"
feature_quicklook_desc: "Finder 中选中 .md 文件按空格，即可预览渲染效果——无需打开应用，快速浏览文档。"
feature_document_copy_title: "内容一键复制"
feature_document_copy_desc: "渲染模式、原文模式与 Quick Look 均可一键复制整篇内容；设置可统一关闭，Quick Look 支持富文本或原始 Markdown。"
feature_themes_title: "33 套主题"
feature_themes_desc: "20 深色 + 13 浅色，Dracula、Catppuccin、Nord、Tokyo Night……含 Markdown Preview Enhanced 风格主题，总有一款适合你。"
feature_command_palette_title: "命令面板"
feature_command_palette_desc: "按 ⌘P 快速搜索并打开文件，模糊匹配文件名，支持键盘上下导航与回车打开。"
feature_cli_title: "命令行工具 mdr"
feature_cli_desc: "终端输入 `mdr README.md` 即可打开文件或目录，开发者工作流无缝衔接。"
feature_lightweight_title: "极小极轻 & 按需加载"
feature_lightweight_desc: "DMG 安装包不到 10MB。图表与公式按需加载，普通 Markdown 零额外内存开销，打开即用。"
feature_drag_title: "拖拽打开"
feature_drag_desc: "将 .md 文件或文件夹直接拖入窗口，即刻开始阅读，无需菜单操作。"
feature_pdf_title: "导出 PDF"
feature_pdf_desc: "一键将渲染后的 Markdown 导出为 PDF，保留主题样式，方便分享和存档。"

