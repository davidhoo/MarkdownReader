help_quickstart_title: "快速入门"
help_quickstart_subtitle: "打开文件，开始阅读，就这么简单"
help_qs_open_title: "1. 打开文件或文件夹"
help_qs_open_desc: "按 ⌘O 选择文件，或按 ⇧⌘N 新建独立窗口。支持拖拽文件/文件夹直接打开。"
help_qs_read_title: "2. 阅读与平滑切换"
help_qs_read_desc: "左侧目录树，中间内容区，右侧大纲导航。按 ⇧⌘E / ⇧⌘R 在渲染与源码间平滑切换，阅读位置精准保持。"
help_qs_edit_title: "3. 编辑与源码行号"
help_qs_edit_desc: "在原文模式中直接编辑，⌘S 保存；可在设置中开启源码行号，长文编辑清晰有序。"
help_qs_command_palette_title: "4. 快速打开文件"
help_qs_command_palette_desc: "按 ⌘P 打开命令面板，输入文件名模糊搜索，↑↓ 选择，Enter 打开。比浏览目录树更快。"

