help_features_title: "功能詳解"
help_features_subtitle: "每個功能都為閱讀體驗而生"
feat_render_title: "渲染檢視"
feat_render_desc: "cmark-gfm 引擎解析 Markdown，WebPage（macOS 26 原生）渲染為富文字。支援完整 GFM 擴展語法，包括表格、任務列表、刪除線、自動連結等。"
feat_switch_title: "平滑模式切換"
feat_switch_desc: "基於小數原始碼錨點管線（SourceScrollAnchor），在渲染模式與原文模式之間切換時精確保留閱讀位置，不跳行、不白屏。"
feat_edit_title: "原文編輯與行號"
feat_edit_desc: "按 ⇧⌘R 直接編輯 Markdown 原始碼，Prism.js 高亮 30+ 語言。可在外觀設定中開啟原始碼行號（Gutter），自適應寬度且滾動平穩。"
feat_multiwindow_title: "原生多視窗"
feat_multiwindow_desc: "按 ⇧⌘N 可新增獨立視窗，支援同時開啟多個文件或目錄；每個視窗擁有獨立的編輯狀態與復原堆疊（Per-window Undo）。"
feat_filetree_title: "智慧目錄樹"
feat_filetree_desc: "遞迴瀏覽資料夾，完整支援目錄符號連結（Symlink）與來源目錄變動監聽。支援「開啟單一文件時自動在側邊欄瀏覽所在目錄」。"
feat_outline_title: "大綱導航"
feat_outline_desc: "自動提取標題層級結構，點擊平滑滾動並統一定位至視口頂部，閱讀長文件更高效。"
feat_find_title: "尋找與取代"
feat_find_desc: "按 ⌘F 開啟尋找列。支援區分大小寫、全詞比對、規則運算式。⌥⌘F 開啟尋找與取代。"
feat_zoom_title: "檢視縮放"
feat_zoom_desc: "使用 ⌘+ / ⌘- 縮放內容，範圍 0.3x–3.0x。按 ⌘0 恢復實際大小，縮放層級自動恢復。"
feat_command_palette_title: "命令面板"
feat_command_palette_desc: "按 ⌘P 開啟命令面板，輸入檔名快速搜尋並開啟目錄樹中的 Markdown 檔案。支援模糊比對和鍵盤導航（↑↓ 選擇，Enter 開啟）。"

help_themes_title: "主題與外觀"
help_themes_subtitle: "33 套主題，打造你的閱讀空間"
feat_mode_title: "主題模式"
feat_mode_desc: "在設定 → 外觀中，可選擇淺色、深色或跟隨系統三種模式，應用立即切換外觀。"
feat_palette_title: "配色方案"
feat_palette_desc: "33 套預設配色（20 深色 + 13 淺色），Dracula、Catppuccin、Nord、Tokyo Night……每種模式有獨立配色。"
feat_custom_title: "自訂顏色"
feat_custom_desc: "在設定 → 外觀 → 自訂顏色中，可單獨調整背景色、文字色、強調色、成功色、危險色。"
feat_contrast_title: "對比度調節"
feat_contrast_desc: "提供低/高兩檔對比度選項，調整背景與前景層之間的視覺對比。"

help_diagrams_title: "圖表與公式"
help_diagrams_subtitle: "技術文件的完美渲染"
feat_mermaid_help_title: "雙圖表引擎 (Mermaid / Pele)"
feat_mermaid_help_desc: "在程式碼區塊中使用 `mermaid` 標識。可在一般設定中切換圖表引擎：預設 Mermaid.js 保持經典佈局，可選 Pele 引擎輸出與主題深度融合變色的原生 SVG。本機渲染，無網路依賴。"
feat_katex_title: "數學公式 (KaTeX)"
feat_katex_desc: "使用 `$...$` 包裹行內公式，`$$...$$` 包裹區塊公式。LaTeX 語法完美呈現，且僅在正文包含公式時按需載入執行階段。"
feat_plantuml_help_title: "PlantUML 圖表"
feat_plantuml_help_desc: "在程式碼區塊中使用 `plantuml` 語言標識，自動渲染為 SVG 圖表。需要網路連線。"

help_cli_title: "命令列工具 mdr"
help_cli_subtitle: "終端機工作流程無縫銜接"
feat_cli_install_title: "安裝"
feat_cli_install_desc: "開啟 設定 → 一般 → 命令列工具，開啟開關即可安裝。安裝完成後，`mdr` 命令可在終端機直接調用。"
feat_cli_use_title: "使用"
feat_cli_use_desc: "終端機輸入 `mdr README.md` 即可開啟檔案，支援同時開啟多個檔案和資料夾。"

help_more_title: "更多功能"
help_more_subtitle: "還有這些貼心功能等你發現"
feat_ql_title: "Quick Look 預覽"
feat_ql_desc: "在 Finder 中選取 .md 檔案按空白鍵，即可預覽渲染效果。需在 設定 → 一般 → Quick Look 預覽 中啟用。"
feat_export_title: "匯出 PDF"
feat_export_desc: "按 ⌥⌘E 或使用選單 檔案 → 匯出 PDF，將渲染內容匯出為 PDF 檔案，保留目前主題樣式。"
feat_document_copy_title: "內容一鍵複製"
feat_document_copy_desc: "渲染模式、原文模式與 Quick Look 均可一鍵複製整篇內容；在 設定 → 一般 中可統一關閉三處複製入口。Quick Look 開啟時可選擇複製為富文字或原始 Markdown。"

help_faq_title: "常見問題"
help_faq_subtitle: "遇到問題？先看看這裡"
faq_formats_q: "支援哪些檔案格式？"
faq_formats_a: "支援 `.md`、`.markdown`、`.mdown`、`.mkd` 等 Markdown 格式檔案。"
faq_system_q: "系統需求是什麼？"
faq_system_a: "macOS 26 (Tahoe) 或更高版本，原生支援 Apple Silicon。"
faq_homebrew_q: "如何透過 Homebrew 安裝與升級？"
faq_homebrew_a: "終端機執行 `brew tap davidhoo/markdownreader && brew install --cask markdownreader` 即可安裝。升級時使用 `brew upgrade --cask --greedy markdownreader`。"
faq_gatekeeper_q: "首次開啟提示未公證或無法開啟怎麼辦？"
faq_gatekeeper_a: "MarkdownReader 是開發者簽章的開源應用，未加入 Apple Developer 付費公證。首次啟動若被 Gatekeeper 攔截，請在「應用程式」中按住 Control 點擊應用圖示並選擇「開啟」，或進入「系統設定 > 隱私與安全性」點擊「仍要開啟」。"
faq_plantuml_q: "PlantUML 圖表無法渲染？"
faq_plantuml_a: "PlantUML 渲染需要網路連線，請確保可以存取 PlantUML 伺服器。離線環境下 Mermaid / Pele 圖表均可完全本機渲染。"
faq_default_q: "如何設定 Markdown Reader 為預設開啟程式？"
faq_default_a: "開啟 設定 → 一般 → 預設 Markdown 開啟程式，點擊「設為預設」即可。也可以右鍵 .md 檔案 → 顯示簡介 → 開啟方式 → 選擇 Markdown Reader → 點擊「全部更改」。"
faq_feedback_q: "如何回饋問題或建議？"
faq_feedback_a: "歡迎在 GitHub Issues 中提交回饋與 Pull Request。"

