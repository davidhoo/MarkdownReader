# Features
features_title: "為什麼選它？"
features_subtitle: "市面上 Markdown 工具越來越多，但你只是想安靜地讀完一個文件"
feature_instant_title: "秒開秒讀"
feature_instant_desc: "原生 macOS 應用程式，啟動快、切換快、閱讀流暢。沒有啟動畫面，沒有載入等待。"
feature_focus_title: "專注閱讀"
feature_focus_desc: "三欄佈局——目錄樹 + 渲染檢視 + 大綱導航，一眼看清文件結構，長文件也不迷路。"
feature_multiwindow_title: "原生多視窗"
feature_multiwindow_desc: "支援多視窗獨立工作階段（⇧⌘N），每個視窗擁有獨立編輯與復原堆疊，多篇文件並排查閱不衝突。"
feature_seamless_switch_title: "平滑模式切換"
feature_seamless_switch_desc: "基於小數原始碼錨點管線，在渲染檢視與原文編輯間無縫切換，精確定位不跳行、不白屏。"
feature_mermaid_title: "雙圖表引擎可選"
feature_mermaid_desc: "支援經典 Mermaid.js 與原生輕量 Pele 引擎，同一段 ```mermaid SVG 配色深度融入主題；支援 PlantUML。"
feature_math_title: "數學公式"
feature_math_desc: "KaTeX 渲染 LaTeX 行內和區塊公式，按需輕量載入，技術文件排版細膩。"
feature_linenumbers_title: "即時編輯與原始碼行號"
feature_linenumbers_desc: "原文模式直接編輯，⌘S 儲存；可選顯示原始碼行號（Gutter），自適應寬度，捲動流暢不抖動。"
feature_smart_tree_title: "智慧目錄樹"
feature_smart_tree_desc: "遞迴瀏覽資料夾，支援目錄符號連結與檔案變動即時監聽；可選開啟單一文件時自動列出所在目錄。"
feature_outline_title: "大綱導航"
feature_outline_desc: "自動提取標題層級，點擊平滑滾動並統一定位至視口頂部，閱讀長文件更高效。"
feature_quicklook_title: "Quick Look 預覽"
feature_quicklook_desc: "Finder 中選取 .md 檔案按空白鍵，即可預覽渲染效果——無需開啟應用程式，快速瀏覽文件。"
feature_document_copy_title: "內容一鍵複製"
feature_document_copy_desc: "渲染模式、原文模式與 Quick Look 均可一鍵複製整篇內容；設定可統一關閉，Quick Look 支援富文字或原始 Markdown。"
feature_themes_title: "33 套主題"
feature_themes_desc: "20 深色 + 13 淺色，Dracula、Catppuccin、Nord、Tokyo Night……含 Markdown Preview Enhanced 風格主題，總有一款適合你。"
feature_command_palette_title: "命令面板"
feature_command_palette_desc: "按 ⌘P 快速搜尋並開啟檔案，模糊比對檔案名稱，支援鍵盤上下導航與 Enter 開啟。"
feature_cli_title: "命令列工具 mdr"
feature_cli_desc: "終端機輸入 `mdr README.md` 即可開啟檔案或資料夾，開發者工作流程無縫銜接。"
feature_lightweight_title: "極小極輕 & 按需載入"
feature_lightweight_desc: "DMG 安裝包不到 10MB。圖表與公式按需載入，普通 Markdown 零多餘記憶體開銷，開啟即用。"
feature_drag_title: "拖拽開啟"
feature_drag_desc: "將 .md 檔案或資料夾直接拖入視窗，即刻開始閱讀，無需選單操作。"
feature_pdf_title: "匯出 PDF"
feature_pdf_desc: "一鍵將渲染後的 Markdown 匯出為 PDF，保留主題樣式，方便分享和歸檔。"

