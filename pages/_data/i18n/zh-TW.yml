help_quickstart_title: "快速入門"
help_quickstart_subtitle: "開啟檔案，開始閱讀，就這麼簡單"
help_qs_open_title: "1. 開啟檔案或資料夾"
help_qs_open_desc: "按 ⌘O 選擇檔案，或按 ⇧⌘N 新增獨立視窗。支援拖曳檔案/資料夾直接開啟。"
help_qs_read_title: "2. 閱讀與平滑切換"
help_qs_read_desc: "左側目錄樹，中間內容區，右側大綱導航。按 ⇧⌘E / ⇧⌘R 在渲染與原始碼間平滑切換，閱讀位置精確保持。"
help_qs_edit_title: "3. 編輯與原始碼行號"
help_qs_edit_desc: "在原文模式中直接編輯，⌘S 儲存；可在設定中開啟原始碼行號，長文編輯清晰有序。"
help_qs_command_palette_title: "4. 快速開啟檔案"
help_qs_command_palette_desc: "按 ⌘P 開啟命令面板，輸入檔名模糊搜尋，↑↓ 選擇，Enter 開啟。比瀏覽目錄樹更快。"

